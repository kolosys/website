[build]
  base = "apps/docs"
  command = "cd ../.. && pnpm install && pnpm turbo run build --filter=docs"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[context.production]
  command = "cd ../.. && pnpm install && pnpm turbo run build --filter=docs"

[context.deploy-preview]
  command = "cd ../.. && pnpm install && pnpm turbo run build --filter=docs"

[context.branch-deploy]
  command = "cd ../.. && pnpm install && pnpm turbo run build --filter=docs"

# Environment variables needed (set in Netlify UI):
# - NEXT_PUBLIC_BASE_URL
# - HUB_API_KEY
# - HUB_API_URL 