[build]
  command = "pnpm turbo run build --filter=docs"
  publish = "apps/docs/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "pnpm turbo run build --filter=docs"

[context.deploy-preview]
  command = "pnpm turbo run build --filter=docs"

[context.branch-deploy]
  command = "pnpm turbo run build --filter=docs"


# Environment variables needed (set in Netlify UI):
# - NEXT_PUBLIC_BASE_URL
# - HUB_API_KEY
# - HUB_API_URL 